name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild on Sundays at 3:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      anki_version:
        description: 'Anki version to build (e.g. 26.09.4)'
        required: false
        default: '26.09.4'

env:
  ANKI_VERSION: ${{ github.event.inputs.anki_version || '26.09.4' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.ANKI_VERSION }}
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ANKI_VERSION=${{ env.ANKI_VERSION }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ env.ANKI_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
