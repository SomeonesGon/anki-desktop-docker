services:
  anki-desktop:
    image: chrislongros/anki-desktop:latest
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: anki-desktop
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      # Optional: Custom sync server
      # - ANKI_SYNC_SERVER=http://your-sync-server:8080
      # Optional: Disable AnkiConnect auto-install (default: true)
      # - ANKICONNECT_ENABLED=false
      # Optional: Override AnkiConnect port (default: 8765)
      # - ANKICONNECT_PORT=8765
      # Optional: Disable Anki Beacon auto-install (default: true)
      # - ANKIBEACON_ENABLED=false
      # Optional: Override Anki Beacon webhook URL (default: http://localhost:7275)
      # - ANKIBEACON_URL=http://your-webhook-receiver:7275
      # Optional: Disable Local Audio for Yomichan auto-install (default: true)
      # - LOCALAUDIO_ENABLED=false
      # Optional: Override Local Audio server port (default: 5050)
      # - LOCALAUDIO_PORT=5050
      # Optional: CJK font support (uncomment to enable)
      # - DOCKER_MODS=linuxserver/mods:universal-package-install
      # - INSTALL_PACKAGES=fonts-arphic-ukai|fonts-arphic-uming|fonts-ipafont-mincho|fonts-ipafont-gothic|fonts-unfonts-core
    volumes:
      # Anki data persistence
      - ./anki_data:/config
    ports:
      # KasmVNC web interface
      - 3000:3000
      # HTTPS (optional)
      - 3001:3001
      # AnkiConnect API
      - 8765:8765
      # Anki Beacon webhook receiver (expose if running receiver on host/another container)
      - 7275:7275
      # Local Audio Server for Yomichan/Yomitan
      - 5050:5050
    restart: unless-stopped
    # Required for Anki/Qt
    security_opt:
      - seccomp=unconfined
    shm_size: "1gb"
